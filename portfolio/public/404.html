<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // Single-Page-App redirect for GitHub Pages.
      // GitHub Pages has no server-side routing, so a direct load of e.g. /project/vision
      // 404s. This encodes the real path into a query string and redirects to index.html,
      // where a matching script (see index.html) decodes it back before React Router mounts.
      // pathSegmentsToKeep = 0 because this is a user page (antsdrew.github.io) served from root.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
